<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-blobs" aria-hidden="true"><i></i><i></i></div>

  <header class="site-header" id="siteHeader">
    <a class="brand" href="/" aria-label="dr-tools">
      <span class="brand-mark">Rx</span>
      <span class="brand-text">
        <strong id="brandName">دکتر ابزار</strong>

    </a>
    <nav class="main-nav" id="mainNav" aria-label="main"></nav>
    <div class="header-actions">
      <button class="search-pill" id="searchOpen" type="button">
        <svg viewBox="0 0 24 24" class="i">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
        </svg>
        <span id="searchLabel">جستجوی ابزار…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <button class="icon-btn" id="langBtn" type="button" title="English / فارسی"><span class="lang-face">EN</span></button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="theme">
        <svg class="i sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2" />
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" />

      </button>
    </div>

  <main id="app" class="site-main"></main>

  <footer class="site-footer">

      <div class="footer-brand">
        <span class="brand-mark small">Rx</span>
        <p id="footerTag"></p>
      </div>

    <div class="footer-bottom">
      <span id="footerCopy"></span>
      <span class="footer-credit" id="footerCredit"></span>
      <span class="privacy-note" id="footerPrivacy"></span>
    </div>
  </footer>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <div class="palette-backdrop hidden" id="paletteBackdrop">
    <div class="palette" role="dialog" aria-modal="true">
      <div class="palette-input-row">
        <svg viewBox="0 0 24 24" class="i">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
        </svg>
        <input id="paletteInput" type="text" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <ul class="palette-results" id="paletteResults"></ul>
    </div>
